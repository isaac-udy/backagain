[versions]
androidx-lifecycle = "2.10.0"
cloudSqlSocketFactory = "1.29.0"
composeMultiplatform = "1.12.0"
composeMaterial3 = "1.9.0"
composeMaterialIcons = "1.7.3"
qrose = "1.3.0"
enro = "3.0.0-beta05"
kotlin = "2.4.0"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
kotlinx-datetime = "0.8.0"
kotlinx-browser = "0.5.0"
koin = "4.2.2"
konsist = "0.17.3"
ksp = "2.3.9"
ktor = "3.5.2"
logback = "1.5.37"
# Not applied anywhere — the Ktor plugin applies Shadow — but build-logic compiles against the
# ShadowJar type, and Ktor keeps Shadow out of its consumable compile metadata. Keep this equal to
# the version Ktor brings: `./gradlew :app:server:buildEnvironment | grep shadow`.
shadow = "9.1.0"
junit5 = "5.11.4"
udytils = "1.5.0"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit5" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }
compose-materialIconsExtended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "composeMaterialIcons" }
qrose = { module = "io.github.alexzhirkevich:qrose", version.ref = "qrose" }
compose-resources ={ module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
kotlinx-coroutinesCore = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-browser = { module = "org.jetbrains.kotlinx:kotlinx-browser", version.ref = "kotlinx-browser" }

logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
cloudSql-postgresSocketFactory = { module = "com.google.cloud.sql:postgres-socket-factory", version.ref = "cloudSqlSocketFactory" }

ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-resources = { module = "io.ktor:ktor-resources", version.ref = "ktor" }

ktor-serverCore = { module = "io.ktor:ktor-server-core-jvm", version.ref = "ktor" }
ktor-serverNetty = { module = "io.ktor:ktor-server-netty-jvm", version.ref = "ktor" }
ktor-serverWebsockets = { module = "io.ktor:ktor-server-websockets-jvm", version.ref = "ktor" }
ktor-serverContentNegotiation = { module = "io.ktor:ktor-server-content-negotiation-jvm", version.ref = "ktor" }
ktor-serverStatusPages = { module = "io.ktor:ktor-server-status-pages-jvm", version.ref = "ktor" }
ktor-serverCallLogging = { module = "io.ktor:ktor-server-call-logging-jvm", version.ref = "ktor" }
ktor-serverCompression = { module = "io.ktor:ktor-server-compression-jvm", version.ref = "ktor" }
ktor-serverAutoHeadResponse = { module = "io.ktor:ktor-server-auto-head-response-jvm", version.ref = "ktor" }
ktor-serverForwardedHeader = { module = "io.ktor:ktor-server-forwarded-header-jvm", version.ref = "ktor" }
ktor-serverResources = { module = "io.ktor:ktor-server-resources-jvm", version.ref = "ktor" }
ktor-serverRateLimit = { module = "io.ktor:ktor-server-rate-limit-jvm", version.ref = "ktor" }
ktor-serverTestHost = { module = "io.ktor:ktor-server-test-host-jvm", version.ref = "ktor" }

ktor-clientCore = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-clientJs = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
ktor-clientJava = { module = "io.ktor:ktor-client-java", version.ref = "ktor" }
ktor-clientResources = { module = "io.ktor:ktor-client-resources", version.ref = "ktor" }
ktor-clientWebsockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
ktor-clientContentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-clientMock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-composeViewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }
koin-ktor = { module = "io.insert-koin:koin-ktor", version.ref = "koin" }

konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }

enro-core = { module = "dev.enro:enro", version.ref = "enro" }
enro-common = { module = "dev.enro:enro-common", version.ref = "enro" }
enro-test = { module = "dev.enro:enro-test", version.ref = "enro" }
enro-processor = { module = "dev.enro:enro-processor", version.ref = "enro" }

udytils-core = { module = "dev.isaacudy.udytils:core", version.ref = "udytils" }
udytils-ui = { module = "dev.isaacudy.udytils:ui", version.ref = "udytils" }

# `postgres-core` (runtime) and `postgres-koin` are production artifacts; `postgres-embedded` is
# dev/test only (it drags in Zonky + the Postgres binaries) and belongs to
# `:platform:server:development` alone.
udytils-postgres-core = { module = "dev.isaacudy.udytils:postgres-core", version.ref = "udytils" }
udytils-postgres-koin = { module = "dev.isaacudy.udytils:postgres-koin", version.ref = "udytils" }
udytils-postgres-embedded = { module = "dev.isaacudy.udytils:postgres-embedded", version.ref = "udytils" }

udytils-architectureCore = { module = "dev.isaacudy.udytils:architecture-core", version.ref = "udytils" }
udytils-architectureAnnotations = { module = "dev.isaacudy.udytils:architecture-annotations", version.ref = "udytils" }

# Build-logic dependencies (gradle plugin classpath artifacts)
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinx-serialization-gradlePlugin = { module = "org.jetbrains.kotlin.plugin.serialization:org.jetbrains.kotlin.plugin.serialization.gradle.plugin", version.ref = "kotlin" }
compose-gradlePlugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "composeMultiplatform" }
compose-compiler-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
# The Ktor Gradle plugin is published under its own plugin-id group; it applies Shadow, whose
# `shadowJar` task backagain.server-packaging configures.
ktor-gradlePlugin = { module = "io.ktor.plugin:plugin", version.ref = "ktor" }
shadow-gradlePlugin = { module = "com.gradleup.shadow:shadow-gradle-plugin", version.ref = "shadow" }

[plugins]
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }
kotlinKsp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
udytilsArchitecture = { id = "dev.isaacudy.udytils.architecture", version.ref = "udytils" }
udytilsPostgres = { id = "dev.isaacudy.udytils.postgres", version.ref = "udytils" }
